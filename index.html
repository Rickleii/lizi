<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
<title>💌 献给最特别的你</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;display:block}
#caption{position:fixed;left:50%;top:60%;transform:translate(-50%,-50%);width:88%;text-align:center;color:#fff;font-size:clamp(17px,4.2vw,27px);line-height:2;letter-spacing:2px;text-shadow:0 0 12px rgba(255,120,160,.9),0 0 30px rgba(255,80,130,.5);opacity:0;transition:opacity 1s ease;pointer-events:none;z-index:5}
#caption.show{opacity:1}
#caption .big{font-size:1.25em;color:#ffd9e6;font-weight:bold}
#info{position:fixed;bottom:18px;width:100%;text-align:center;color:rgba(255,255,255,.4);font-size:13px;letter-spacing:3px;z-index:5;pointer-events:none}
#start{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(circle at 50% 40%,#141433,#000);z-index:9;cursor:pointer;transition:opacity .8s}
#start.hide{opacity:0;pointer-events:none}
#start .h1{color:#fff;font-size:clamp(30px,8vw,48px);text-shadow:0 0 20px #ff3366,0 0 60px #ff3366;animation:pulse 2.2s infinite}
#start .h2{color:rgba(255,255,255,.6);font-size:14px;margin-top:24px;letter-spacing:4px}
@keyframes pulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
#yesBtn{position:fixed;left:50%;bottom:15%;transform:translateX(-50%);padding:14px 46px;font-size:19px;letter-spacing:4px;color:#fff;background:linear-gradient(135deg,#ff5e8e,#ff9a3d);border:none;border-radius:40px;cursor:pointer;z-index:8;display:none;box-shadow:0 0 26px rgba(255,94,142,.75),0 4px 16px rgba(0,0,0,.45);animation:pulse 2s infinite;font-family:inherit}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="caption"></div>
<div id="info">💌 献给最特别的你 💌</div>
<button id="yesBtn">我愿意 💗</button>
<div id="start"><div class="h1">💌</div><div class="h2">点 击 开 启 · 建 议 戴 上 耳 机</div></div>
<script>
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
const capEl=document.getElementById('caption'),startEl=document.getElementById('start');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',()=>{resize();initStars();});
const R=(a,b)=>a+Math.random()*(b-a);
let stars=[],parts=[],events=[];
let t0=null,tOffset=0,cur=-1,curCap=null,planetOn=false,heartOn=false;

const SC=[
{s:0,e:8},{s:8,e:15},{s:15,e:22},{s:22,e:30},
{s:30,e:42},{s:42,e:52},{s:52,e:1e9}
];
const BGS=[
['#02020a','#0b1030'],['#050510','#141033'],['#050514','#1a1040'],
['#0a0616','#2a0f33'],['#060618','#181238'],['#241028','#a85838'],
['#050510','#101535']
];
const CAPS=[
{t:1.5,d:3.2,h:'在遇见你之前，<br>我的世界是一片沉默的星海。'},
{t:4.8,d:3.0,h:'直到你出现——<br>所有星辰，都有了方向。'},
{t:9.0,d:3.3,h:'遇见你那一刻，<br>我听见了心跳爆炸的声音。'},
{t:12.4,d:2.4,h:'不是烟花，<br>是我藏了很久的——<span class="big">"我喜欢你"。</span>'},
{t:15.5,d:2.8,h:'你是宇宙赠予我的意外惊喜，'},
{t:18.4,d:3.3,h:'是亿万星辰里，<br>我唯一想靠近的光。'},
{t:24.0,d:5.5,h:'<span class="big">520</span>，不是一串数字，<br>是我每一次心跳的——<span class="big">次数</span>。'},
{t:31.0,d:1.7,h:'<span class="big">I</span> — 是无数个日夜的思念'},
{t:32.8,d:1.7,h:'<span class="big">L</span> — 是每次见你时的心动'},
{t:34.6,d:1.7,h:'<span class="big">O</span> — 是你笑起来时，我世界的模样'},
{t:36.4,d:1.7,h:'<span class="big">V</span> — 是我想把最好的都给你'},
{t:38.2,d:1.7,h:'<span class="big">E</span> — 是……我好像词穷了'},
{t:40.0,d:1.9,h:'<span class="big">YOU</span> —<br>是我所有情话的终点，<br>也是我所有未来的起点。'},
{t:44.0,d:1.6,h:'<span class="big">明</span>，'},
{t:45.6,d:1.6,h:'是晨曦破晓的光，'},
{t:47.2,d:1.7,h:'是我在人群中一眼认出你的那种——<span class="big">笃定</span>。'},
{t:48.9,d:2.6,h:'也是我往后每一个清晨，<br>都想第一眼见到的人。'},
{t:53.0,d:2.3,h:'我不是一个擅长浪漫的人，'},
{t:55.4,d:2.2,h:'但遇见你之后，我想把全宇宙的星光，<br>都摘下来，编成一句话——'},
{t:57.8,d:1e9,h:'<span class="big">"做我的女朋友吧"</span> 💗'}
];

function tNow(){return t0===null?0:(performance.now()-t0)/1000+tOffset;}
function after(dt,fn){events.push({t:tNow()+dt,fn});}
function spawn(o){parts.push(Object.assign({x:0,y:0,vx:0,vy:0,tx:0,ty:0,size:2,hue:330,sat:92,lit:63,a:1,mode:'free',g:0,ease:.06,ph:R(0,6.28),rad:0,spd:0},o));}

function initStars(){stars=[];const n=Math.round(W*H/4200);for(let i=0;i<n;i++)stars.push({x:R(0,W),y:R(0,H),r:R(.4,1.5),tw:R(0,6.28),sp:R(.5,2)});}

function sampleText(text,fontPx,cx){
const c=document.createElement('canvas'),g=c.getContext('2d');
const f=`bold ${fontPx}px "Microsoft YaHei","PingFang SC",sans-serif`;
g.font=f;
const w=Math.ceil(g.measureText(text).width)+40,h=Math.ceil(fontPx*1.5);
c.width=w;c.height=h;g.font=f;g.textAlign='center';g.textBaseline='middle';g.fillStyle='#fff';
g.fillText(text,w/2,h/2);
const d=g.getImageData(0,0,w,h).data;
const step=Math.max(2,Math.floor(fontPx/26));
const scale=Math.min(W*.9/w,H*.3/h);
const ox=(cx||W/2)-w*scale/2,oy=H*.45-h*scale/2;
const pts=[];
for(let y=0;y<h;y+=step)for(let x=0;x<w;x+=step){
if(d[(y*w+x)*4+3]>120)pts.push({x:ox+x*scale,y:oy+y*scale,fx:(x/w)});
}
return{pts,w:w*scale};
}

function formText(text,fontPx,hueFn,ease,cx){
const{pts,w}=sampleText(text,fontPx,cx);
for(const p of pts)spawn({x:R(0,W),y:R(0,H),tx:p.x,ty:p.y,mode:'form',ease:ease||.05,size:R(.9,1.7),hue:hueFn?hueFn(p.fx):338,sat:95,lit:70,a:0,wamp:R(.015,.06),wspd:R(.35,.8),gx:W/2,gy:H*.45});
return w;
}

function shoot(){spawn({x:R(W*.1,W*.9),y:-20,vx:R(-3,3),vy:R(6,10),mode:'shoot',size:2,hue:210,sat:60,lit:85,a:1});}
function burst(x,y,hue,n){
n=n||190;
for(let k=0;k<n;k++){
const a=Math.random()*Math.PI*2,sp=R(1,5.5),big=Math.random()<.16;
spawn({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.2,mode:'fire',g:.045,size:big?R(2.2,3.2):R(1,2.1),hue:hue+R(-28,28),sat:big?82:95,lit:big?76:64,a:1,fw:R(.0035,.0058)});
}
const m=Math.floor(n*.22);
for(let k=0;k<m;k++){
const a=Math.random()*Math.PI*2,sp=R(.3,1.8);
spawn({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,mode:'fire',g:.02,size:R(.8,1.5),hue:46,sat:75,lit:88,a:1,fw:R(.005,.008)});
}
}
function gatherHeart(){
const sc=Math.min(W,H)/42;
for(let i=0;i<850;i++){
const a=Math.random()*Math.PI*2;
const x=16*Math.pow(Math.sin(a),3);
const y=13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a);
const s=R(.6,1.15);
spawn({x:R(0,W),y:R(0,H),tx:W/2+x*sc*s,ty:H/2+y*sc*s,mode:'form',ease:.03,size:R(1,1.9),shape:'heart',hue:Math.random()<.4?R(38,52):R(330,355),sat:92,lit:66,a:0,wamp:R(.02,.08),wspd:R(.35,.8),gx:W/2,gy:H/2});
}
after(5.8,()=>{burst(W/2,H*.42,340);burst(W/2,H*.42,48);});
}

function pulseHeart(){
const sc=Math.min(W,H)/4.5;
for(let i=0;i<620;i++){
const a=Math.random()*Math.PI*2;
const x=16*Math.pow(Math.sin(a),3);
const y=13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a);
const s=R(.5,1.05);
spawn({mode:'pulse',hx:x/16*sc*s,hy:y/17*sc*s,z:R(0,6.28),bx:W/2,by:H*.47,bs:R(.9,1.9),size:1,shape:'heart',hue:Math.random()<.5?R(38,52):R(328,352),sat:90,lit:R(62,76),a:0,ph:R(0,6.28)});
}
}
function enterScene(i){
for(const p of parts)if(p.mode==='form')p.mode='fade';
planetOn=false;heartOn=false;
if(i===0){after(.5,shoot);after(2.2,shoot);after(4.2,shoot);after(5.6,()=>burst(W*.32,H*.38,48,280));after(6.8,()=>burst(W*.68,H*.32,335,280));after(7.4,()=>burst(W*.5,H*.42,45,200));}
if(i===1){
after(.3,()=>burst(R(W*.25,W*.6),R(H*.15,H*.4),340,220));
after(1.5,()=>burst(R(W*.4,W*.85),R(H*.2,H*.45),45,220));
after(2.8,()=>burst(R(W*.2,W*.7),R(H*.15,H*.4),305,220));
after(4.2,()=>{burst(W*.3,H*.3,48,180);burst(W*.72,H*.38,338,180);});
after(5.8,()=>burst(W*.5,H*.22,45,240));
}
if(i===2){
pulseHeart();
for(let k=0;k<260;k++)spawn({mode:'orbit',ph:R(0,6.28),rad:R(40,Math.min(W,H)*.46),spd:R(.003,.01),size:R(.7,1.6),hue:R(35,55),sat:85,lit:70,a:R(.35,.85)});
}
if(i===3){heartOn=true;formText('520',Math.min(W*.3,180),null,.045);}
if(i===4){formText('ILOVEYOU',Math.min(W*.16,110),fx=>fx*360,.05);}
if(i===5){formText('明',Math.min(W*.4,220),()=>R(25,50),.045);}
if(i===6){heartOn=true;gatherHeart();after(8.5,showYesBtn);}
}

function hex2rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mix(a,b,k){const A=hex2rgb(a),B=hex2rgb(b);return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')})`;}

function updateParts(t){
for(let i=parts.length-1;i>=0;i--){
const p=parts[i];
if(p.mode==='form'){
if(p.a<1)p.a=Math.min(1,p.a+.02);
const wa=p.wamp||0,ws=p.wspd||0,gx=p.gx===undefined?W/2:p.gx,gy=p.gy===undefined?H*.45:p.gy;
const wob=Math.sin(t*ws+p.ph);
p.x+=((p.tx+(p.tx-gx)*wa*wob)-p.x)*p.ease;
p.y+=((p.ty+(p.ty-gy)*wa*wob)-p.y)*p.ease;
}else if(p.mode==='free'){p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.vy*=.99;p.a-=.002;}
else if(p.mode==='fire'){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.975;p.vy*=.975;p.a-=(p.fw||.005);}
else if(p.mode==='fade'){p.y-=.25;p.a-=.012;}
else if(p.mode==='orbit'){p.ph+=p.spd;p.x=W/2+Math.cos(p.ph)*p.rad;p.y=H*.47+Math.sin(p.ph)*p.rad*.38;}
else if(p.mode==='pulse'){
p.gA=Math.min(1,(p.gA||0)+.018);
const cyc=(Math.sin(t*.8-p.z)+1)/2;
const k=1+cyc*1.5;
const ang=t*.2;
const ca=Math.cos(ang),sa=Math.sin(ang);
const rx=p.hx*ca-p.hy*sa,ry=p.hx*sa+p.hy*ca;
const tw=1+.05*Math.sin(t*3+p.ph);
p.x=p.bx+rx*k*tw;
p.y=p.by+ry*k*tw;
p.size=p.bs*(1.1-.4*cyc);
p.a=p.gA*(1-.3*cyc);
}
else if(p.mode==='fire'&&(p.vx||p.vy)){
const sp=Math.hypot(p.vx,p.vy),len=Math.min(20,sp*3.2+3);
if(pa>.06&&sp>.2){
const gr=ctx.createLinearGradient(p.x,p.y,p.x-p.vx/sp*len,p.y-p.vy/sp*len);
gr.addColorStop(0,`hsla(${p.hue},${p.sat}%,${Math.min(94,p.lit+16)}%,${pa})`);
gr.addColorStop(.55,`hsla(${p.hue},${p.sat}%,${p.lit}%,${pa*.35})`);
gr.addColorStop(1,`hsla(${p.hue},${p.sat}%,${p.lit}%,0)`);
ctx.strokeStyle=gr;ctx.lineWidth=Math.max(.7,p.size*.85);ctx.lineCap='round';
ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx/sp*len,p.y-p.vy/sp*len);ctx.stroke();
}
}
if(p.mode==='shoot'){p.x+=p.vx;p.y+=p.vy;p.a-=.02;}
if(p.a<=0||p.x<-60||p.x>W+60||p.y>H+80)parts.splice(i,1);
}
}

function drawHeart(x,y,s){
ctx.beginPath();
ctx.moveTo(x,y+s*.6);
ctx.bezierCurveTo(x-s*1.1,y-s*.5,x-s*.7,y-s*1.2,x,y-s*.5);
ctx.bezierCurveTo(x+s*.7,y-s*1.2,x+s*1.1,y-s*.5,x,y+s*.6);
ctx.fill();
}
function drawRing(t){
const cxc=W/2,cyc=H*.47,r=Math.min(W,H)*.30*(1+.04*Math.sin(t*2.5));
ctx.lineWidth=2;
ctx.strokeStyle=`hsla(340,90%,70%,${.35+.15*Math.sin(t*2.5)})`;
ctx.beginPath();ctx.arc(cxc,cyc,r,0,7);ctx.stroke();
ctx.strokeStyle=`hsla(45,90%,70%,${.25+.15*Math.sin(t*2.5+1)})`;
ctx.beginPath();ctx.arc(cxc,cyc,r*1.18,0,7);ctx.stroke();
}
function drawPlanet(t){
const r=Math.min(W,H)*.35*(1+.03*Math.sin(t*1.8));
const g=ctx.createRadialGradient(W/2,H*.47,r*.1,W/2,H*.47,r);
g.addColorStop(0,'rgba(255,150,180,.45)');
g.addColorStop(.5,'rgba(150,100,255,.16)');
g.addColorStop(1,'rgba(0,0,0,0)');
ctx.fillStyle=g;ctx.beginPath();ctx.arc(W/2,H*.45,r,0,7);ctx.fill();
}

function render(t,idx){
const k=Math.min(1,(t-SC[idx].s)/2);
const prev=idx>0?BGS[idx-1]:BGS[0];
const g=ctx.createLinearGradient(0,0,0,H);
g.addColorStop(0,mix(prev[0],BGS[idx][0],k));
g.addColorStop(1,mix(prev[1],BGS[idx][1],k));
ctx.globalCompositeOperation='source-over';
ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.globalCompositeOperation='lighter';
for(const s of stars){
const a=.3+.7*Math.abs(Math.sin(t*s.sp+s.tw));
ctx.fillStyle=`rgba(255,255,255,${a*.8})`;
ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
}
if(idx===3||finaleOn)drawRing(t);
if(idx===6&&planetOn)drawPlanet(t);
for(const p of parts){
const pa=(p.mode==='fire')?p.a*(.7+.3*Math.sin(t*9+p.ph)):p.a;
if(p.size>2.6&&p.mode!=='form'){
ctx.fillStyle=`hsla(${p.hue},${p.sat}%,${p.lit}%,${pa*.15})`;
ctx.beginPath();ctx.arc(p.x,p.y,p.size*2,0,7);ctx.fill();
}
ctx.fillStyle=`hsla(${p.hue},${p.sat}%,${p.lit}%,${pa})`;
if(p.shape==='heart')drawHeart(p.x,p.y,p.size);
else{ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();}
if(p.mode==='shoot'){
ctx.strokeStyle=`hsla(210,60%,85%,${p.a*.6})`;ctx.lineWidth=1.5;
ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*8,p.y-p.vy*8);ctx.stroke();
}
}
}

function updateCaption(t){
if(finaleOn){capEl.classList.remove('show');curCap=null;return;}
let a=null;
for(let i=CAPS.length-1;i>=0;i--){const c=CAPS[i];if(t>=c.t&&t<c.t+c.d){a=c;break;}}
if(a!==curCap){
if(a){capEl.innerHTML=a.h;capEl.classList.add('show');}
else capEl.classList.remove('show');
curCap=a;
}
}

function loop(){
requestAnimationFrame(loop);
if(t0===null){
ctx.globalCompositeOperation='source-over';
ctx.fillStyle='#02020a';ctx.fillRect(0,0,W,H);
ctx.globalCompositeOperation='lighter';
for(const s of stars){ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}
return;
}
const t=tNow();
const idx=SC.findIndex(s=>t>=s.s&&t<s.e);
if(idx!==cur){cur=idx;events=[];enterScene(idx);}
for(let i=events.length-1;i>=0;i--)if(t>=events[i].t){const f=events[i].fn;events.splice(i,1);f();}
if(cur===1&&Math.random()<.35)spawn({x:R(0,W),y:H+10,vx:R(-.2,.2),vy:R(-.9,-.3),size:R(1.6,2.6),shape:'heart',hue:Math.random()<.3?R(38,52):R(330,355),sat:95,lit:66,a:.9});
if(finaleOn&&Math.random()<.12)burst(R(W*.06,W*.94),R(H*.05,H*.5),R(320,360),R(60,110)|0);
updateParts(t);
render(t,cur);
updateCaption(t);
}

startEl.addEventListener('click',e=>{
e.stopPropagation();
startEl.classList.add('hide');
t0=performance.now();tOffset=0;cur=-1;
});
addEventListener('pointerdown',e=>{
if(t0===null)return;
if(!startEl.classList.contains('hide'))return;
const t=tNow();
const ni=SC.findIndex(s=>s.s>t+.01);
if(ni>0){tOffset+=SC[ni].s-t;events=[];cur=-1;}
});

let finaleOn=false;
function showYesBtn(){document.getElementById('yesBtn').style.display='block';}
function startFinale(){
if(finaleOn)return;
finaleOn=true;
document.getElementById('yesBtn').style.display='none';
document.getElementById('info').textContent='💞';
for(const p of parts)if(p.mode==='form')p.mode='fade';
for(let k=0;k<22;k++)after(k*.28,()=>burst(R(W*.06,W*.94),R(H*.06,H*.55),R(0,360),R(80,160)|0));
after(1.6,()=>{formText('雷朝凯 ♥ 蒋明',Math.min(W*.13,84),fx=>fx<.45?R(40,52):R(328,350),.015,W*.44);});
for(let k=0;k<220;k++)spawn({mode:'orbit',ph:R(0,6.28),rad:R(Math.min(W,H)*.32,Math.min(W,H)*.55),spd:R(.006,.02)*(Math.random()<.5?-1:1),size:R(.8,2.2),hue:Math.random()<.55?R(36,54):R(330,350),sat:90,lit:70,a:R(.3,.85)});
}
document.getElementById('yesBtn').addEventListener('click',e=>{e.stopPropagation();startFinale();});
resize();initStars();loop();
</script>
</body>
</html>
